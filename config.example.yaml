# Universal Social Scraper CLI Configuration Example

platforms:
  - youtube
  - reddit

targets:
  youtube:
    - "@CarryMinati"
    - "https://www.youtube.com/watch?v=dQw4w9WgXcQ"
  reddit:
    - "r/technology"
    - "r/india"
  instagram:
    - "cockroachjantaparty"

limit: 500

# Flexible Filtering Engine
filter:
  emoji_mode: "ALL"               # ALL, WITH_EMOJI, WITHOUT_EMOJI, EMOJI_ONLY
  only_questions: false          # true = only extract comments with '?'
  min_likes: 0                   # minimum engagement threshold
  keywords_include:              # comments must contain one of these (leave empty for none)
    # - "review"
    # - "best"
  keywords_exclude:              # negative keywords (filter out spam/unwanted words)
    - "dm to promote"
    - "free crypto"
    - "telegram"

export_formats:
  - xlsx
  - csv
  - jsonl

output_dir: "data/exports"

# Instagram Session Token (Optional, only needed for private/rate-limited Instagram extraction)
# Use INSTAGRAM_SESSION_ID / INSTAGRAM_PASSWORD environment variables for secrets.
# instagram_username: "your_instagram_username"

# Reddit API Credentials (Required for reliable Reddit scraping)
# Get free API keys at: https://www.reddit.com/prefs/apps
# 1. Go to reddit.com/prefs/apps
# 2. Click "create another app..." at the bottom
# 3. Choose "script" type, give it a name
# 4. Copy the client_id (under app name) and client_secret
# reddit_client_id: "YOUR_CLIENT_ID_HERE"
# Use REDDIT_CLIENT_SECRET / REDDIT_PASSWORD environment variables for secrets.
# reddit_username: "your_reddit_username"
